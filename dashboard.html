<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard — Lizfitness Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="assets/img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="dashboard">

<nav id="nav" class="app-nav">
  <div class="brand">
    <img src="assets/img/logo.png" alt="Lizfitness Gym logo">
    <span>LIZ<b>FITNESS</b> GYM</span>
  </div>
  <div class="nav-right">
    <button class="cart-btn" onclick="openCart()" aria-label="Open cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="21" r="1.4"/><circle cx="18" cy="21" r="1.4"/><path d="M2.5 3h2.2l2.4 12.2a2 2 0 0 0 2 1.6h8.1a2 2 0 0 0 2-1.6L21 7.5H6"/></svg>
      <span class="cart-badge" id="cartBadge" style="display:none;">0</span>
    </button>
    <a href="admin.html" class="nav-cta admin-only-link" style="background:transparent;color:var(--gold);border:1px solid var(--gold);">Admin</a>
    <span class="dash-user-label">Hi, <b id="navUserName">there</b></span>
    <button class="nav-cta" style="border:none;cursor:pointer;font-family:'Inter',sans-serif;" onclick="doLogout()">Log Out</button>
  </div>
</nav>

<section class="dash-page-section">
  <div class="wrap">
    <div class="dash-shell" id="dashPageBox"><p class="empty-note">Loading…</p></div>
  </div>
</section>

<!-- CART MODAL -->
<div class="modal-overlay" id="cartOverlay">
  <div class="modal-box wide" id="cartBox"></div>
</div>

<script src="assets/js/app.js" defer></script>
</body>
</html>
